---
- name: Get list of all installed Appstore Apps
  ansible.builtin.command:
    cmd: "{{ macos_applications_mas_binary }} list"
  register: installed_apps
  check_mode: false
  changed_when: false

- name: Ensure Appstore Apps are present
  ansible.builtin.command:
    cmd: "{{ macos_applications_mas_binary }} install {{ item.id | default(item) }}"
  register: mas_result
  with_items: "{{ macos_applications_installed }}"
  when: >-
    installed_apps.stdout_lines
    | select('match', '^\\s*' ~ (item.id | default(item) | string) ~ '(\\s|$)')
    | list | length == 0
  changed_when: mas_result.rc == 0

- name: Ensure App Store Apps are absent
  ansible.builtin.command:
    cmd: "{{ macos_applications_mas_binary }} uninstall {{ item.id | default(item) }}"
  register: mas_uninstall_result
  loop: "{{ macos_applications_absent }}"
  when: >-
    installed_apps.stdout_lines
    | select('match', '^\\s*' ~ (item.id | default(item) | string) ~ '(\\s|$)')
    | list | length > 0
  changed_when: mas_uninstall_result.rc == 0
